[project]
name = "backend"
version = "0.1.0"
package-mode = false
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcos Santos Peres", email = "marcos.santos.peresvw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai-agents>=0.13.6,<0.14",
    # Faixa compatível com os tipos de uso de tokens do Agents SDK 0.13.
    "openai>=2.26.0,<2.27",
    "fastapi>=0.143.0",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.0,<3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
